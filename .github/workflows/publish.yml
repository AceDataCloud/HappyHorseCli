name: Build and publish HappyHorse CLI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after the existing project allowance resumes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: happyhorse-cli-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish_allowed: ${{ steps.version.outputs.publish_allowed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install normal test/build dependencies
        run: python -m pip install -e '.[test,dev]' build
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Discover offline tests
        run: pytest -m 'not integration'
      - name: Select unique release and respect project allowance gate
        id: version
        run: |
          version="$(date -u +'%Y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          export PACKAGE_VERSION="$version"
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('pyproject.toml')
          text, count = re.subn(r'^version = "[^"]+"', 'version = "' + os.environ['PACKAGE_VERSION'] + '"', path.read_text(), count=1, flags=re.MULTILINE)
          assert count == 1
          path.write_text(text)
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 2026-10-20 00:00 Asia/Shanghai. Before then build only; never
          # repeatedly submit a known blocked first-project publication.
          if [ "$(date -u +%s)" -ge 1792425600 ]; then
            echo "publish_allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_allowed=false" >> "$GITHUB_OUTPUT"
            echo "Project allowance gate: build validated; publication waits until 2026-10-20 Asia/Shanghai."
          fi
      - name: Build exact distribution
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
  publish:
    if: >-
      needs.build.outputs.publish_allowed == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/happyhorse-cli/${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - run: python -m pip install 'twine>=6'
      - run: twine check dist/*
      - name: Publish exact build through existing publisher
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
